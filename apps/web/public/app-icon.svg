<svg width="533" height="533" viewBox="0 0 533 533" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- NexTore app icon: graphite tile + gradient "N" monogram.
       Silhouette matches the previous app icon (rounded 533 tile, flat radii)
       so platform masks, favicon cropping, and the desktop window icon keep
       the same safe area. -->
  <defs>
    <linearGradient id="tile" x1="60" y1="20" x2="480" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B1D27"/>
      <stop offset="0.55" stop-color="#12131A"/>
      <stop offset="1" stop-color="#0C0D12"/>
    </linearGradient>
    <linearGradient id="mark" x1="150" y1="140" x2="390" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6D7CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(266 210) scale(250 220)">
      <stop offset="0" stop-color="#6D7CF8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6D7CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="6" y="6" width="521" height="521" rx="118" fill="url(#tile)"/>
  <rect x="6" y="6" width="521" height="521" rx="118" fill="url(#glow)"/>
  <rect x="7.5" y="7.5" width="518" height="518" rx="116.5"
    stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- N monogram: two uprights plus the diagonal, all round-capped. -->
  <g stroke="url(#mark)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"
     fill="none">
    <path d="M168 386V147"/>
    <path d="M365 147V386"/>
    <path d="M168 147L365 386"/>
  </g>
</svg>
